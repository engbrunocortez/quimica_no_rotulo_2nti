<template id="s1">
  <div class="eyebrow"><span>Estação 1</span><span>≈ 20 min</span><span>Livro p. 384</span></div>
  <h1>Ácidos graxos: retos ou dobrados</h1>
  <p class="lead">Por que a manteiga é sólida e o óleo de soja é líquido, se os dois são “gordura”? A resposta está no formato das moléculas.</p>

  <div class="box read"><h3>Leia no livro <span class="pg">p. 384</span></h3>
    <p>Item 1, <b>“Triacilgliceróis” → “Glicerol e ácidos graxos”</b>. Observe:</p>
    <ul class="tight">
      <li>a fórmula do <b>glicerol</b> e por que ele é chamado de triálcool;</li>
      <li>a lista de ácidos graxos (mirístico, palmítico, esteárico, palmitoleico, oleico, linoleico) e o número de carbonos de cada um;</li>
      <li>as <b>Figuras 1 e 2</b>: moléculas lineares × moléculas recurvadas.</li>
    </ul>
  </div>

  <h2>Três famílias de ácidos graxos</h2>
  <p>Ácido graxo é um <b>ácido carboxílico de cadeia longa</b> (geralmente 12 carbonos ou mais), com o grupo <code>–COOH</code> numa ponta. O que muda de um para outro é a presença de ligações duplas C=C:</p>
  <ul class="tight">
    <li><b>Saturado</b>: só ligações simples entre carbonos. Ex.: esteárico, <code>H<sub>3</sub>C[CH<sub>2</sub>]<sub>16</sub>COOH</code>.</li>
    <li><b>Monoinsaturado</b>: uma ligação dupla C=C. Ex.: oleico.</li>
    <li><b>Poli-insaturado</b>: duas ou mais C=C. Ex.: linoleico.</li>
  </ul>

  <div class="figure">
    <div class="controls" role="group" aria-label="Escolha o ácido graxo">
      <button class="btn" data-fa="est" aria-pressed="true">Esteárico (saturado)</button>
      <button class="btn" data-fa="ole" aria-pressed="false">Oleico (1 C=C)</button>
      <button class="btn" data-fa="lin" aria-pressed="false">Linoleico (2 C=C)</button>
    </div>
    <svg id="faSvg" viewBox="0 0 640 360" role="img" aria-label="Esquema das moléculas de ácido graxo e do seu empacotamento"></svg>
    <p class="cap" id="faCap"></p>
  </div>
  <p>Repare no empacotamento: moléculas <b>retas</b> se encaixam lado a lado, como lápis numa caixa. Essa organização favorece o sólido e eleva a temperatura de fusão. Moléculas <b>dobradas</b> pela ligação dupla não se encaixam bem; o material continua líquido a 25 °C.</p>

  <div class="quiz" data-q="q1a"></div>
  <div class="quiz" data-q="q1b"></div>

  <div class="box caderno"><h3>No caderno · C1</h3>
    <ol>
      <li><span class="tag">C1.a</span> Escreva com suas palavras o que é um ácido graxo e como se classificam (saturado, monoinsaturado, poli-insaturado). Dê um exemplo de cada um, copiando a fórmula do livro (p. 384).</li>
      <li><span class="tag">C1.b</span> Desenhe um esquema simples, como o da Figura 2, comparando o empacotamento das moléculas do ácido esteárico e do ácido oleico. Abaixo do desenho, explique em 3 a 5 linhas por que o esteárico é sólido e o oleico é líquido a 25 °C.</li>
    </ol>
  </div>
</template>

<template id="s2">
  <div class="eyebrow"><span>Estação 2</span><span>≈ 20 min</span><span>Livro p. 385–386</span></div>
  <h1>Triacilgliceróis: um glicerol, três caudas</h1>
  <p class="lead">Óleos e gorduras não são ácidos graxos soltos. Eles são <b>ésteres</b>: o glicerol “segura” três ácidos graxos.</p>

  <div class="box read"><h3>Leia no livro <span class="pg">p. 385–386</span></h3>
    <ul class="tight">
      <li>“Estrutura dos triacilgliceróis”: a estrutura geral e a equação de esterificação.</li>
      <li>O parágrafo sobre gorduras (sólidas) × óleos (líquidos) e as Figuras 3, 4 e 5 (azeite, girassol, abacate).</li>
      <li>Início da p. 386: energia fornecida por lipídios (<b>9 kcal/g</b>) × carboidratos e proteínas (<b>4 kcal/g</b>).</li>
    </ul>
  </div>

  <h2>A reação de formação</h2>
  <p>Cada um dos três grupos <code>–OH</code> do glicerol reage com o <code>–COOH</code> de um ácido graxo. Em cada ligação formada sai uma molécula de água. O grupo que surge, <code class="hl">–COO–</code>, é o grupo <b>éster</b>.</p>
<div class="formula">H<sub>2</sub>C–OH     HO–<span class="hl">CO</span>–R<sub>1</sub>          H<sub>2</sub>C–<span class="hl">O–CO</span>–R<sub>1</sub>
 |                                |
 HC–OH  +  HO–<span class="hl">CO</span>–R<sub>2</sub>    →     HC–<span class="hl">O–CO</span>–R<sub>2</sub>   +  3 H<sub>2</sub>O
 |                                |
H<sub>2</sub>C–OH     HO–<span class="hl">CO</span>–R<sub>3</sub>          H<sub>2</sub>C–<span class="hl">O–CO</span>–R<sub>3</sub>

glicerol   3 ácidos graxos        triacilglicerol      água
(triálcool)                        (triéster)</div>

  <h2>Monte um triacilglicerol</h2>
  <p>Escolha os três ácidos graxos que vão se ligar ao glicerol e veja a tendência do material resultante.</p>
  <div class="figure">

  <h1>Gordura trans: um efeito colateral da indústria</h1>
  <p class="lead">Para transformar óleo líquido em margarina pastosa, a indústria adiciona hidrogênio às ligações duplas. No meio do caminho, algumas moléculas mudam de formato.</p>

  <div class="box read"><h3>Leia no livro <span class="pg">p. 386</span></h3>
    <p>Quadro <b>“Em destaque – Saúde: Gordura trans”</b> e Figura 6. Procure responder enquanto lê:</p>
    <ul class="tight">
      <li>O que é <b>hidrogenação catalítica</b>?</li>
      <li>Por que hoje a hidrogenação é apenas <b>parcial</b>?</li>
      <li>O que acontece com parte dos ácidos graxos <b>cis</b> durante o processo?</li>
    </ul>
  </div>

  <h2>Hidrogenação: dupla vira simples</h2>
<div class="formula">  –CH<span class="hl">=</span>CH–   +   H<sub>2</sub>   <span class="hl">—catalisador→</span>   –CH<sub>2</sub>–CH<sub>2</sub>–
 (insaturada)                         (saturada)
   óleo, líquido                       gordura, sólida</div>

  <h2>Cis × trans: a mesma fórmula, outro formato</h2>
  <p>Na ligação dupla, os dois pedaços da cadeia podem ficar do <b>mesmo lado</b> (cis, a forma natural) ou em <b>lados opostos</b> (trans). A molécula trans fica quase reta, como uma saturada, e se comporta de modo parecido no organismo.</p>

    </div>

    <p class="cap" id="ctCap"></p>

  <h1>Carboidratos: do açúcar ao amido</h1>
  <p class="lead">Glicose, sacarose, amido e celulose pertencem à mesma família. A diferença está em quantas unidades de açúcar estão ligadas entre si.</p>

  <div class="box read"><h3>Leia no livro <span class="pg">p. 395–396</span></h3>
    <ul class="tight">
      <li>Item 4, <b>“Carboidratos”</b>: monossacarídios e dissacarídios (glicose, frutose, sacarose, lactose, maltose).</li>

      <li>Opcional, se sobrar tempo: “A produção de etanol por fermentação” (p. 396).</li>
    </ul>
  </div>

  <h2>Monossacarídios: aldose ou cetose</h2>
  <p>Glicose e frutose têm a mesma fórmula molecular, <code>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></code>, e vários grupos <code class="hl">–OH</code> (são <b>poliálcoois</b>). A diferença está no grupo carbonila <span class="hl2 mono">C=O</span>:</p>
  <div class="figure">
    <div class="fischer">
      <div class="col"><b>Glicose · aldose</b>
        <span class="carbonyl">H–C=O</span> <small>(aldeído)</small><br>
        H–C–<span class="oh">OH</span><br>
        <span class="oh">HO</span>–C–H<br>
        H–C–<span class="oh">OH</span><br>
        H–C–<span class="oh">OH</span><br>
        CH<sub>2</sub><span class="oh">OH</span>
      </div>
      <div class="col"><b>Frutose · cetose</b>
        CH<sub>2</sub><span class="oh">OH</span><br>
        <span class="carbonyl">C=O</span> <small>(cetona)</small><br>
        <span class="oh">HO</span>–C–H<br>
        H–C–<span class="oh">OH</span><br>
        H–C–<span class="oh">OH</span><br>
        CH<sub>2</sub><span class="oh">OH</span>
      </div>
    </div>
    <p class="cap">Cadeias abertas, representadas na vertical. Na natureza, essas moléculas aparecem principalmente na forma cíclica (livro, p. 395).</p>
  </div>

  <h2>Juntando unidades</h2>
<div class="formula">Dissacarídio:   C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>  →  C<sub>12</sub>H<sub>22</sub>O<sub>11</sub> + H<sub>2</sub>O
                  glicose    frutose         sacarose

Polissacarídio:  n C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>  →  (C<sub>6</sub>H<sub>10</sub>O<sub>5</sub>)<sub>n</sub> + n H<sub>2</sub>O
                  glicose        amido, glicogênio ou celulose</div>
  <ul class="tight">
    <li><b>Amido</b>: reserva de energia das plantas (trigo, arroz, batata). Polímero da α-glicose.</li>
    <li><b>Glicogênio</b>: reserva de energia de animais e fungos. Polímero da α-glicose.</li>
    <li><b>Celulose</b>: estrutura da parede celular vegetal. Polímero da β-glicose. Não é digerida por nós; é a principal <b>fibra alimentar</b>.</li>
  </ul>

const $=s=>document.querySelector(s);
const page=$("#page"), nav=$("#nav");
const seen=new Set();
let cur=0;
const NS="http://www.w3.org/2000/svg";
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

STATIONS.forEach((s,i)=>{
  const li=document.createElement("li");

function go(i,noScroll){
  cur=Math.max(0,Math.min(STATIONS.length-1,i));
  seen.add(cur);
  page.innerHTML="";
  page.appendChild(document.getElementById(STATIONS[cur].id).content.cloneNode(true));
  const pg=document.createElement("div");pg.className="pager";
  pg.innerHTML=(cur>0?`<button class="btn" id="prev">← ${STATIONS[cur-1].t}</button>`:"<span></span>")+
               (cur<STATIONS.length-1?`<button class="btn primary" id="next">${STATIONS[cur+1].t} →</button>`:"");
  page.appendChild(pg);
  pg.querySelector("#prev")?.addEventListener("click",()=>go(cur-1));
  pg.querySelector("#next")?.addEventListener("click",()=>go(cur+1));
  nav.querySelectorAll("button").forEach((b,k)=>{b.setAttribute("aria-current",k===cur);b.parentElement.classList.toggle("seen",seen.has(k)&&k!==cur)});
  nav.querySelector(`[data-i="${cur}"]`).scrollIntoView({block:"nearest",inline:"nearest"});
  $("#progTxt").textContent=cur===0?"Início":`Estação ${STATIONS[cur].n==="✦"?"final":STATIONS[cur].n} · visitadas ${seen.size}/${STATIONS.length}`;
  $("#progBar").style.width=(seen.size/STATIONS.length*100)+"%";
  try{history.replaceState(null,"","#"+STATIONS[cur].id)}catch(e){}
  if(!noScroll)window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
  page.querySelectorAll(".quiz[data-q]").forEach(buildQuiz);
  if(cur===1)initFA(); if(cur===2)initTAG(); if(cur===3)initCT(); if(cur===4)initSorter(); if(cur===5)initLabels(); if(cur===6)initCheck();

let qn=0;
function buildQuiz(el){
  const q=QUIZ[el.dataset.q]; qn++;
  el.innerHTML=`<div class="qh">Confira · não vale nota</div><p class="qt">${q.t}</p><div class="opts"></div><div class="fb" hidden></div>`;
  const opts=el.querySelector(".opts"), fb=el.querySelector(".fb");
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(97+k)+") "+t;
    b.addEventListener("click",()=>{
      opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));

      fb.innerHTML=`<b>${ok?"Isso mesmo.":"Ainda não."}</b> ${q.f[k]}${ok?"":" Tente outra alternativa."}`;
    });
    opts.appendChild(b);
  });
}

/* ---------- desenho de cadeias ---------- */
function chainPoints(x0,y0,len,bends,step,angle,dir){
  // zigue-zague; em cada posição de ligação dupla cis a direção gira
  const pts=[[x0,y0]]; let a=angle||0; let x=x0,y=y0; const h=step*0.5;
  for(let i=1;i<=len;i++){
    if(bends.includes(i))a+=(dir||1)*0.42;
    const up=i%2?-1:1;
    x+=Math.cos(a)*step;
    y+=Math.sin(a)*step;
    const ox=-Math.sin(a)*up*h*0.5, oy=Math.cos(a)*up*h*0.5;
    pts.push([x+ox,y+oy]);
  }
  return pts;
}
function poly(svg,pts,stroke,w,dbl){
  const p=document.createElementNS(NS,"polyline");
  p.setAttribute("points",pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" "));
  p.setAttribute("fill","none");p.setAttribute("stroke",stroke);p.setAttribute("stroke-width",w);p.setAttribute("stroke-linejoin","round");p.setAttribute("stroke-linecap","round");
  svg.appendChild(p);
  (dbl||[]).forEach(i=>{ if(pts[i]&&pts[i-1]){const [a,b]=[pts[i-1],pts[i]];const l=document.createElementNS(NS,"line");
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L*4,ny=dx/L*4;
    l.setAttribute("x1",a[0]+nx+dx*.15);l.setAttribute("y1",a[1]+ny+dy*.15);l.setAttribute("x2",b[0]+nx-dx*.15);l.setAttribute("y2",b[1]+ny-dy*.15);
    l.setAttribute("stroke",css("--butter"));l.setAttribute("stroke-width",w+1);l.setAttribute("stroke-linecap","round");svg.appendChild(l);}});
}
function txt(svg,x,y,s,fill,size,anchor,weight){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("fill",fill);t.setAttribute("font-size",size||13);t.setAttribute("font-family",css("--f-mono")||"monospace");if(anchor)t.setAttribute("text-anchor",anchor);if(weight)t.setAttribute("font-weight",weight);t.textContent=s;svg.appendChild(t);return t}
function circ(svg,x,y,r,fill){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("fill",fill);svg.appendChild(c)}

/* Estação 1 */
function initFA(){
  const svg=$("#faSvg"), cap=$("#faCap");
  const btns=page.querySelectorAll("[data-fa]");
  function draw(k){
    btns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.fa===k));
    svg.innerHTML="";const f=FA[k];const ink=css("--ink"),ol=css("--olive"),mu=css("--muted");
    txt(svg,20,24,"Uma molécula",mu,12);
    const pts=chainPoints(30,f.bends.length?115:80,17,f.bends,17,0,-1);
    poly(svg,pts,ink,2.4,f.bends.map(b=>b));
    const e=pts[pts.length-1]; circ(svg,e[0]+8,e[1],9,css("--bad")); txt(svg,e[0]+20,e[1]+4,"COOH",css("--bad"),12);
    txt(svg,20,170,"Várias moléculas juntas (25 °C)",mu,12);
    for(let r=0;r<5;r++){
      const jitter=f.bends.length? (r%2? .35:-.25)*(f.bends.length):0;
      const p=chainPoints(30+(f.bends.length?(r*13)%40:0),(f.bends.length?250:195)+r*(f.bends.length?20:14),17,f.bends,14,jitter*.3,-1);
      poly(svg,p,f.bends.length?ol:ink,1.8,[]);
    }
    txt(svg,620,352,f.bends.length?"empacotamento desordenado → líquido":"empacotamento ordenado → sólido",f.bends.length?ol:ink,12,"end",600);
    cap.textContent=f.cap;
  }
  btns.forEach(b=>b.addEventListener("click",()=>draw(b.dataset.fa)));
  draw("est");
}

/* Estação 2 */
function initTAG(){
  const sels=["#r1","#r2","#r3"].map(s=>$(s)); const defs=["pal","ole","lin"];
  sels.forEach((s,i)=>{Object.entries(FATS).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.n;s.appendChild(o)});s.value=defs[i];s.addEventListener("change",draw)});
  function draw(){
    const svg=$("#tagSvg");svg.innerHTML="";const ink=css("--ink"),ol=css("--olive"),mu=css("--muted");
    const ys=[70,140,210];
    txt(svg,14,ys[0]+4,"H₂C",ink,14,null,600);txt(svg,22,ys[1]+4,"HC",ink,14,null,600);txt(svg,14,ys[2]+4,"H₂C",ink,14,null,600);
    const l=document.createElementNS(NS,"line");l.setAttribute("x1",30);l.setAttribute("x2",30);l.setAttribute("y1",ys[0]+10);l.setAttribute("y2",ys[2]-12);l.setAttribute("stroke",ink);l.setAttribute("stroke-width",2);svg.appendChild(l);
    let nsat=0;
    sels.forEach((s,i)=>{const f=FATS[s.value];if(f.sat)nsat++;
      txt(svg,52,ys[i]+4,"–O–CO–",ol,14,null,600);
      const p=chainPoints(118,ys[i],f.len,f.b,16,0,-1);poly(svg,p,f.sat?ink:ol,2.2,f.b);
    });
    txt(svg,626,252,"amarelo = ligação dupla C=C",mu,11,"end");
    const out=$("#tagOut");
    const msg=nsat===3?"3 cadeias saturadas → forte tendência a ser <b>gordura (sólida)</b>, como o sebo bovino."
      :nsat===2?"2 saturadas e 1 insaturada → tendência a <b>gordura</b> ou material pastoso."
      :nsat===1?"1 saturada e 2 insaturadas → tendência a <b>óleo (líquido)</b>. O abacate, por exemplo, mistura palmítico e oleico."
      :"3 cadeias insaturadas → <b>óleo (líquido)</b>, como os óleos de girassol e soja.";
    out.innerHTML=`Grupos éster: 3 · Cadeias saturadas: ${nsat} de 3<br>${msg}`;
  }
  draw();
  const cn=$("#cn"),hm=$("#hm");
  function calc(){const n=+cn.value,m=+hm.value,o=$("#cOut");
    if(!n||!m){o.textContent="Preencha n e m.";return}
    const sat=2*n+1,d=(sat-m)/2;
    if(d<0||!Number.isInteger(d)){o.innerHTML=`Com n = ${n}, o máximo é m = ${sat}. Esse valor de m não corresponde a um ácido graxo válido.`;return}
    const cl=d===0?"saturado":d===1?"monoinsaturado":"poli-insaturado";
    o.innerHTML=`Saturado teria m = 2·${n} + 1 = ${sat}<br>Faltam ${sat-m} H → ${d} ligação(ões) dupla(s) → <b>${cl}</b>`;}
  cn.addEventListener("input",calc);hm.addEventListener("input",calc);calc();
}

/* Estação 3 */
function initCT(){
  const svg=$("#ctSvg"),cap=$("#ctCap"),btns=page.querySelectorAll("[data-ct]");
  function draw(k){
    btns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.ct===k));
    svg.innerHTML="";const ink=css("--ink"),ol=css("--olive"),mu=css("--muted"),bu=css("--butter");
    const cx1=280,cx2=360,cy=100;
    // ligação dupla
    [[-5],[5]].forEach(([d])=>{const l=document.createElementNS(NS,"line");l.setAttribute("x1",cx1+12);l.setAttribute("x2",cx2-12);l.setAttribute("y1",cy+d);l.setAttribute("y2",cy+d);l.setAttribute("stroke",bu);l.setAttribute("stroke-width",4);svg.appendChild(l)});
    txt(svg,cx1,cy+5,"C",ink,16,"middle",700);txt(svg,cx2,cy+5,"C",ink,16,"middle",700);
    function bond(x1,y1,x2,y2,c){const l=document.createElementNS(NS,"line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke",c);l.setAttribute("stroke-width",2.5);l.setAttribute("stroke-linecap","round");svg.appendChild(l)}
    // cadeia esquerda sempre para baixo-esquerda
    const L=chainPoints(cx1-10,cy+14,6,[],22,Math.PI*0.86,1); poly(svg,L,ol,2.4,[]);
    bond(cx1-6,cy-12,cx1-26,cy-40,mu);txt(svg,cx1-34,cy-44,"H",mu,14,"middle");
    if(k==="cis"){
      const R=chainPoints(cx2+10,cy+14,6,[],22,Math.PI*0.14,-1); poly(svg,R,ol,2.4,[]);
      bond(cx2+6,cy-12,cx2+26,cy-40,mu);txt(svg,cx2+34,cy-44,"H",mu,14,"middle");
      txt(svg,320,240,"cadeias do mesmo lado → molécula dobrada",ink,13,"middle",600);
      cap.textContent="cis: os dois Hs ficam do mesmo lado da ligação dupla e as duas partes da cadeia também. A molécula forma um “cotovelo” e empacota mal. É a forma natural nos óleos vegetais.";
    }else{
      const R=chainPoints(cx2+10,cy-14,6,[],22,-Math.PI*0.14,1); poly(svg,R,ol,2.4,[]);
      bond(cx2+6,cy+12,cx2+26,cy+40,mu);txt(svg,cx2+34,cy+56,"H",mu,14,"middle");
      txt(svg,320,240,"cadeias em lados opostos → molécula quase reta",ink,13,"middle",600);
      cap.textContent="trans: os Hs (e as partes da cadeia) ficam em lados opostos. A molécula fica quase linear, parecida com a saturada, e é ainda mais prejudicial à saúde cardiovascular.";
    }
  }
  btns.forEach(b=>b.addEventListener("click",()=>draw(b.dataset.ct)));
  draw("cis");
}

/* Estação 4 */
function initSorter(){
  const box=$("#sorter");
  CARBS.forEach(([name,cat],i)=>{
    const row=document.createElement("div");row.className="srow";
    row.innerHTML=`<span><b>${name}</b></span><span class="seg">${["mono","di","poli"].map(c=>`<button class="btn" data-c="${c}" aria-pressed="false">${c}</button>`).join("")}</span><span class="r" hidden></span>`;
    const r=row.querySelector(".r");
    row.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{
      row.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));
      const ok=b.dataset.c===cat; r.hidden=false; r.className="r "+(ok?"right":"wrong");
      r.textContent=ok?`Certo. ${name} é ${CARB_FB[cat]}`:`Ainda não. Releia a p. 395 e tente de novo.`;
    }));
    box.appendChild(row);
  });
}

/* Estação 5 */
function initLabels(){
  const box=$("#labels");
  LABELS.forEach(L=>{
    const d=document.createElement("div");d.className="prod";
    d.innerHTML=`<h4>${L.name} <span style="font-weight:400;color:var(--muted)">(fictício)</span></h4>
      <div class="lupa">${L.lupa.length?L.lupa.map(x=>`<span>🔍 ${x}</span>`).join(""):'<span class="none">sem lupa</span>'}</div>
      <div class="tablewrap"><table class="nut"><caption>INFORMAÇÃO NUTRICIONAL</caption>
      <thead><tr><th colspan="4" style="text-align:left;font-weight:400">Porções por embalagem: 5 · Porção: ${L.por}</th></tr>
      <tr><th></th><th>100 g</th><th>${L.por.split(" ")[0]} ${L.por.split(" ")[1]}</th><th>%VD*</th></tr></thead>
      <tbody>${L.rows.map(r=>`<tr class="${r[4]?"ind":""}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}
      <tr class="tiny"><td colspan="4">*Percentual de valores diários fornecidos pela porção.</td></tr></tbody></table></div>`;
    box.appendChild(d);
  });
  const ids=["#kc","#kp","#kg"].map(s=>$(s));
  function calc(){const [c,p,g]=ids.map(i=>parseFloat(i.value)||0);const ec=c*4,ep=p*4,eg=g*9,t=ec+ep+eg;
    const pc=v=>t?Math.round(v/t*100):0;
    $("#kOut").innerHTML=`carboidratos: ${c} × 4 = ${ec.toFixed(0)} kcal (${pc(ec)}%)<br>proteínas: ${p} × 4 = ${ep.toFixed(0)} kcal (${pc(ep)}%)<br>gorduras: ${g} × 9 = ${eg.toFixed(0)} kcal (${pc(eg)}%)<br><b>total ≈ ${t.toFixed(0)} kcal</b>`;}
  ids.forEach(i=>i.addEventListener("input",calc));calc();
}
